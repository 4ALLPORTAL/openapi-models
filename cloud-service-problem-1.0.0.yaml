CloudServiceProblem:
  type: object
  description: |
    Problem JSON (RFC 9457) of a cloud service, with field errors in `invalid_params`.
  properties:
    type:
      type: string
      description: |
        `problem/{status}`, or `problem/feature-not-assigned` if the tenant has not booked
        the feature of the service.
    title:
      type: string
    status:
      type: integer
      minimum: 100
      maximum: 599
    detail:
      type: string
    instance:
      type: string
    invalid_params:
      type: array
      description: |
        Every field error of the request, all of them at once. Values of a wrong type are
        listed up to a limit; see `invalid_params_truncated`.
      items:
        $ref: '#/CloudServiceInvalidParam'
    invalid_params_truncated:
      type: boolean
      description: |
        `true` if `invalid_params` does not list every field error, as there are more than
        the limit per request. The rest is reported once the listed ones are fixed. Missing
        means `false`.

CloudServiceInvalidParam:
  type: object
  required:
    - code
    - label
    - message
  properties:
    field:
      type: string
      description: |
        The field as JSON Pointer (RFC 6901), identical to the `path` of the patch operation,
        e.g. `/modules/file/template`. For a value of the wrong type it points to that value,
        which may lie below the `path` if the operation set a whole object. Missing if the
        error concerns no single field.
    code:
      type: string
      description: Machine-readable code, e.g. `NOT_IN_INDEXING_MODELS`.
    label:
      type: string
      description: Label key to display, e.g. `L-A-NLS-DEFAULT-ERROR-NOT_IN_INDEXING_MODELS`.
    message:
      type: string
      description: English plain text for logs and debugging, not for display.

CloudServiceFeatureNotAssigned:
  description: |
    The tenant has not booked the feature of the service. `type` is
    `problem/feature-not-assigned`, which tells it apart from any other `403`.
  content:
    application/problem+json:
      schema:
        $ref: '#/CloudServiceProblem'

CloudServiceUnexpectedError:
  description: Unexpected error
  content:
    application/problem+json:
      schema:
        $ref: '#/CloudServiceProblem'
